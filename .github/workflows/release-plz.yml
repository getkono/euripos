name: release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  # Tags and creates the GitHub release once a release pull request merges
  # (release_always = false). Nothing is published to crates.io (git_only).
  release:
    name: release
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'getkono'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # Opens or updates the release pull request: version bump and CHANGELOG.
  release-pr:
    name: release-pr
    runs-on: ubuntu-24.04
    if: github.repository_owner == 'getkono'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          # A pull request opened with GITHUB_TOKEN does not start CI. A
          # RELEASE_PLZ_TOKEN secret (a fine-grained token or app token with
          # contents and pull-requests write) makes CI run on it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
