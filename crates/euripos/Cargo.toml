[package]
name = "euripos"
description = "An async HTTP client that adapts its transport to the network it is on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["http", "client", "async", "network"]
categories = ["network-programming", "web-programming::http-client"]

[features]
default = ["crypto-ring"]
# The crypto provider rustls and quinn use, one `crypto-<provider>` feature
# each; see docs/adr/0001-crypto-provider.md. It selects nothing yet: the
# client uses the process-wide rustls provider until ring can be in the graph.
# TODO(#32): enable `rustls/ring` and `tokio-rustls/ring`.
crypto-ring = []

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-pool", "http1", "http2", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "time", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tower-layer = "0.3"
tower-service = "0.3"

# The Linux network monitor (docs/design/network-context.md): rtnetlink
# sockets, and NetworkManager's `Metered` over the system D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
futures-core = "0.3"
libc = "0.2"
netlink-sys = { version = "0.9", default-features = false, features = ["tokio_socket"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[lints]
workspace = true

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "tokio"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "time", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[example]]
name = "baseline"
# Its argument parsing and statistics have unit tests.
test = true
