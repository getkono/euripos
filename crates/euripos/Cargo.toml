[package]
name = "euripos"
description = "An async HTTP client that adapts its transport to the network it is on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["http", "client", "async", "network"]
categories = ["network-programming", "web-programming::http-client"]

[features]
default = ["crypto-ring"]
# The crypto provider rustls and quinn use, one `crypto-<provider>` feature
# each; see docs/adr/0001-crypto-provider.md. It selects nothing yet: the
# client uses the process-wide rustls provider until ring can be in the graph.
# TODO(#32): enable `rustls/ring` and `tokio-rustls/ring`.
crypto-ring = []
# The response content codings the client asks for and decodes, one feature
# each; none is on by default. Each adds a pure-Rust decoder and no public
# item (docs/design/parity.md, "Response decompression").
gzip = ["dep:flate2"]
brotli = ["dep:brotli-decompressor"]
zstd = ["dep:ruzstd"]

[dependencies]
brotli-decompressor = { version = "6", optional = true }
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
http = "1"
http-body = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-pool", "http1", "http2", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-platform-verifier = "0.7"
ruzstd = { version = "0.9", optional = true }
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "time", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tower-layer = "0.3"
tower-service = "0.3"

# The Linux network monitor (docs/design/network-context.md): rtnetlink
# sockets, and NetworkManager's `Metered` over the system D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
futures-core = "0.3"
libc = "0.2"
netlink-sys = { version = "0.9", default-features = false, features = ["tokio_socket"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

# The Windows network monitor (docs/design/network-context.md): IP Helper
# change notifications and routes, the Network List Manager's cost over COM,
# and WinHTTP's proxy configuration. `windows-core` is named for the COM
# `implement` macro, which refers to it, and for its `std` error conversions.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_NetworkListManager",
  "Win32_Networking_WinHttp",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
windows-core = { version = "0.62", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "tokio"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "time", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[example]]
name = "baseline"
# Its argument parsing and statistics have unit tests.
test = true
