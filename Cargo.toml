[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Stable minus two minor releases when set; see CONTRIBUTING.md, "MSRV".
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getkono/euripos"
authors = ["Justin Chung"]

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
